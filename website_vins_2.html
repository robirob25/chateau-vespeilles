<!DOCTYPE html>
<html lang="fr">
    <head>
        <title>404 - Cette page n'existe pas!</title>
    
        <meta charset="utf-8">
        <meta name="viewport" content="initial-scale=1, width=device-width">
    
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto Sans:wght@300;400;700;900&display=swap">
    
        <style>
            main {
                padding: 1rem;
                max-width: 800px;
                font-size: 15px;
                font-family: 'Noto Sans';
                text-align: center;
            }
            .b {
                position: relative;
                font-size: calc(70px + 9vw);
                color: #dfe1e5;
                font-weight: bolder;
                right: 4%;
                top: 20px;
                display: inline-block;
            }
            .oops {
                font-size: calc(35px + 4vw);
                font-weight: 900;
                color: #f2b441;
                position: absolute;
                bottom: calc(-4px - .3vw);
                right: -15%;
            }
        </style>
    </head>
    <body class="d-flex align-items-center py-4">
        <main class="m-auto">
            <div class="m-auto pt-5 b">
                404
                <span class="oops">Oops !</span>
            </div>
            <div class="m-auto pt-5 text-sm-center">Il semblerait que la page que vous demandez n’existe pas, ou qu’elle a
                été supprimée.
            </div>
            <div class="w-50 m-auto pt-5">
                <a href="/" class="btn btn-light w-100 py-2" tabindex="-1" role="button" title="Retour en page d'accueil">Retour
                    à l'accueil</a>
            </div>
        </main>
    </body>
</html>
